<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Modificar fruta</h1>
    <form method="post">
        {% csrf_token %}
        <label for="nombre">Nombre: </label>
        <input type="text" id="nombre" value="{{ fruta.nombre }}" name='nombre' required><br>

        <label for="precio">Precio: </label>
        <input type="number" id="precio" name="precio" step="0.1" value="{{ fruta.precio }}" required><br>

        <label for="distribuidora">Distribuidora: </label>
        <input type="text" id="distribuidora" name="distribuidora" value="{{ fruta.distribuidora }}" required><br>
    
        <button type ="submit">Guardar Cambios</button>
    </form>
    <a href="{% url 'fruta' %}">Cancelar</a>
</body>
</html>
